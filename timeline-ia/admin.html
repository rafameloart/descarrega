<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Cadastros · Timeline com IA</title>
<style>
@font-face { font-family: "Chivo Mono"; src: url("../ChivoMono.ttf") format("truetype"); font-weight: 100 900; font-display: swap; }
:root {
  --pag: #0a0a0c; --luz: #f4f4f8; --meio: #8d8c9a; --fraco: #5c5b68;
  --bloco: #141318; --bloco-borda: #26252c;
  --acento: #ff8236; --acento-texto: #1d0f04; --acento-fraco: #3b2110; --critico: #ee6a6a;
  --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
  --mono: "Chivo Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--pag); color: var(--luz); font-family: var(--ui); -webkit-font-smoothing: antialiased; }
.pag { max-width: 1100px; margin: 0 auto; padding: 36px 20px 60px; }
.rotulo { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--acento); margin: 0 0 10px; }
h1 { margin: 0 0 24px; font-size: 28px; letter-spacing: -.02em; }
input { height: 44px; padding: 0 12px; font: 15px var(--ui); color: var(--luz); background: var(--bloco); border: 1px solid var(--bloco-borda); border-radius: 0; outline: none; }
input:focus { border-color: var(--acento); }
button { height: 44px; padding: 0 18px; font: 600 14px var(--ui); border-radius: 999px; cursor: pointer; border: 1px solid var(--bloco-borda); background: var(--bloco); color: var(--luz); }
button.forte { background: var(--acento); border-color: var(--acento); color: var(--acento-texto); }
#entrar { display: flex; gap: 10px; flex-wrap: wrap; max-width: 460px; }
#entrar input { flex: 1; min-width: 200px; }
.erro { color: var(--critico); font-size: 14px; min-height: 1em; margin: 12px 0; }
#painel { display: none; }
.numeros { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 20px; }
.num { background: var(--bloco); border: 1px solid var(--bloco-borda); padding: 16px; }
.num b { display: block; font-size: 30px; letter-spacing: -.02em; }
.num span { font-family: var(--mono); font-size: 11px; color: var(--meio); text-transform: uppercase; letter-spacing: .08em; }
.acoes { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.acoes input { flex: 1; min-width: 200px; }
.tabela { overflow-x: auto; border: 1px solid var(--bloco-borda); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--bloco-borda); white-space: nowrap; }
th { font-family: var(--mono); font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .08em; color: var(--meio); background: var(--bloco); position: sticky; top: 0; }
td.email { color: var(--acento); }
td.fraco { color: var(--meio); }
tr:last-child td { border-bottom: 0; }
.vazio { padding: 28px; text-align: center; color: var(--meio); }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--luz); color: var(--pag); padding: 10px 16px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.on { opacity: 1; }
</style>
</head>
<body>
<div class="pag">
  <p class="rotulo">Admin · Timeline com IA</p>
  <h1>Cadastros</h1>

  <form id="entrar">
    <input id="senha" type="password" placeholder="Senha" autocomplete="current-password" required>
    <button class="forte" type="submit">Entrar</button>
  </form>
  <p class="erro" id="erro"></p>

  <div id="painel">
    <div class="numeros">
      <div class="num"><b id="n-total">0</b><span>Cadastros</span></div>
      <div class="num"><b id="n-hoje">0</b><span>Hoje</span></div>
      <div class="num"><b id="n-semana">0</b><span>Últimos 7 dias</span></div>
      <div class="num"><b id="n-editor">—</b><span>Editor mais citado</span></div>
    </div>
    <div class="acoes">
      <input id="busca" type="search" placeholder="Buscar nome, e-mail, editor ou origem">
      <button id="copiar">Copiar e-mails</button>
      <button id="csv">Baixar CSV</button>
      <button id="atualizar">Atualizar</button>
      <button id="sair">Sair</button>
    </div>
    <div class="tabela">
      <table>
        <thead><tr><th>Data</th><th>Nome</th><th>E-mail</th><th>Editor</th><th>Origem</th><th>Vezes</th></tr></thead>
        <tbody id="linhas"></tbody>
      </table>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script>
const $ = id => document.getElementById(id);
let cadastros = [];

function guardar(chave, valor) { try { valor == null ? sessionStorage.removeItem(chave) : sessionStorage.setItem(chave, valor); } catch (e) {} }
function lembrar(chave) { try { return sessionStorage.getItem(chave); } catch (e) { return null; } }
function aviso(texto) { const t = $('toast'); t.textContent = texto; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 1800); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function quando(iso) { const d = new Date(iso); return isNaN(d) ? iso : d.toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }); }

async function carregar(senha) {
  $('erro').textContent = '';
  if (!window.CAPTURA_URL) { $('erro').textContent = 'Falta o endereço do Apps Script em config.js.'; return; }
  try {
    const r = await fetch(window.CAPTURA_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ acao: 'listar', senha }),
    });
    const dados = await r.json();
    if (!dados.ok) throw new Error(dados.erro);
    guardar('senha', senha);
    cadastros = dados.cadastros.sort((a, b) => new Date(b.data) - new Date(a.data));
    $('entrar').style.display = 'none';
    $('painel').style.display = 'block';
    desenhar();
  } catch (e) {
    guardar('senha', null);
    $('entrar').style.display = 'flex';
    $('painel').style.display = 'none';
    $('erro').textContent = e.message === 'senha incorreta' ? 'Senha incorreta.' : 'Não consegui buscar os cadastros.';
  }
}

function filtrados() {
  const q = $('busca').value.trim().toLowerCase();
  if (!q) return cadastros;
  return cadastros.filter(c => [c.nome, c.email, c.editor, c.origem].join(' ').toLowerCase().includes(q));
}

function desenhar() {
  const agora = Date.now(), hoje = new Date().toDateString();
  $('n-total').textContent = cadastros.length;
  $('n-hoje').textContent = cadastros.filter(c => new Date(c.data).toDateString() === hoje).length;
  $('n-semana').textContent = cadastros.filter(c => agora - new Date(c.data) < 7 * 864e5).length;
  const contagem = {};
  cadastros.forEach(c => { if (c.editor) contagem[c.editor] = (contagem[c.editor] || 0) + 1; });
  const top = Object.entries(contagem).sort((a, b) => b[1] - a[1])[0];
  $('n-editor').textContent = top ? top[0] : '—';

  const lista = filtrados();
  $('linhas').innerHTML = lista.length ? lista.map(c => `<tr>
      <td class="fraco">${esc(quando(c.data))}</td><td>${esc(c.nome)}</td><td class="email">${esc(c.email)}</td>
      <td>${esc(c.editor || '—')}</td><td class="fraco">${esc(c.origem || '—')}</td><td class="fraco">${c.vezes}</td></tr>`).join('')
    : '<tr><td colspan="6" class="vazio">Nenhum cadastro' + ($('busca').value ? ' com essa busca' : ' ainda') + '.</td></tr>';
}

$('entrar').addEventListener('submit', e => { e.preventDefault(); carregar($('senha').value); });
$('busca').addEventListener('input', desenhar);
$('atualizar').addEventListener('click', () => carregar(lembrar('senha')).then(() => aviso('Atualizado')));
$('sair').addEventListener('click', () => { guardar('senha', null); location.reload(); });
$('copiar').addEventListener('click', async () => {
  const texto = filtrados().map(c => c.email).join(', ');
  try { await navigator.clipboard.writeText(texto); aviso(filtrados().length + ' e-mails copiados'); } catch (e) { prompt('Copie:', texto); }
});
$('csv').addEventListener('click', () => {
  const campo = s => '"' + String(s ?? '').replace(/"/g, '""') + '"';
  const linhas = [['Data', 'Nome', 'E-mail', 'Editor', 'Origem', 'Vezes']]
    .concat(filtrados().map(c => [quando(c.data), c.nome, c.email, c.editor, c.origem, c.vezes]));
  const blob = new Blob(['﻿' + linhas.map(l => l.map(campo).join(';')).join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'cadastros-timeline-ia-' + new Date().toISOString().slice(0, 10) + '.csv';
  a.click();
});

const salva = lembrar('senha');
if (salva) carregar(salva);
</script>
</body>
</html>
